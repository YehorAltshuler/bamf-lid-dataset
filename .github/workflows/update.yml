name: Update BAMF dataset

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: playwright install --with-deps chromium
      - run: pytest
      - run: bamf-lid all
      - name: Publish files for GitHub Pages
        run: |
          rm -rf docs
          mkdir docs
          cp -R data/published/. docs/
      - name: Commit validated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update BAMF dataset"
          git push
